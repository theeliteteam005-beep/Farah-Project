<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>يوم الضمير العالمي</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 600px;
            text-align: center;
            border-top: 8px solid #2ecc71;
        }
        h1 { color: #2c3e50; margin-bottom: 10px; }
        .date { color: #27ae60; font-weight: bold; font-size: 1.2rem; }
        p { color: #576574; line-height: 1.8; font-size: 1.1rem; }
        .footer { margin-top: 20px; font-size: 0.8rem; color: #95a5a6; border-top: 1px solid #eee; padding-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>يوم الضمير العالمي</h1>
        <p class="date">5 نيسان / أبريل</p>
        <p>يوم الضمير العالمي هو دعوة عالمية لإيقاظ الضمير الإنساني وتعزيز ثقافة السلام والمحبة. يذكرنا هذا اليوم بأن السلام الحقيقي يبدأ من الداخل، وبأننا جميعاً شركاء في بناء مستقبل يسوده العدل والتفاهم.</p>
        <div class="footer">مشروع Farah Al Ramahi - 2026</div>
    </div>
</body>
</html>
